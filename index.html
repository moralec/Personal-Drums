<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Drummer</title>
<style>
:root {
  --bg: #0f0f0f; --card: #141414; --line: #222; --line2: #2a2a2a; --ink: #e0e0e0; --dim: #777;
  --amber: #f5a623; --blue: #5b9bd5; --coral: #ff6b81; --stop: #e5484d;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--ink); background: var(--bg);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom)); }
.brand { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--amber); font-weight: 600; }

/* library */
.lib-head { padding: 22px 0 22px; }
.lib-h1 { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-top: 6px; }
.lib-sub { margin-top: 4px; font-size: 15px; color: #666; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; overflow: auto; padding-bottom: 24px; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px 16px 18px; text-align: center; display: block; text-decoration: none; color: inherit; }
.card:hover { border-color: #3a3a3a; }
.card:active { transform: translateY(1px); }
.card .emoji { font-size: 56px; line-height: 1.1; }
.card .name { font-size: 18px; font-weight: 700; color: #fff; margin-top: 10px; }
.card .meta { font-size: 12px; color: var(--dim); margin-top: 4px; min-height: 16px; letter-spacing: 1px; }
.card .star { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; font-size: 22px; color: var(--amber); }
.empty { color: #555; margin-top: 40px; font-size: 14px; line-height: 1.6; }

/* song */
.top { display: flex; align-items: center; gap: 14px; padding: 6px 0 4px; }
.home { width: 56px; height: 56px; border-radius: 50%; background: var(--card); border: 1px solid var(--line2); font-size: 24px; flex: none; }
.home:hover { border-color: var(--amber); }
.song-label { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--amber); font-weight: 600; }
.song-title { font-size: clamp(22px, 4.5vw, 32px); font-weight: 800; color: #fff; letter-spacing: -0.5px; flex: 1; line-height: 1.1; }
.song-meta { font-size: 12px; color: var(--dim); text-align: right; line-height: 1.5; }
.song-meta strong { color: var(--amber); }
.stage { position: relative; flex: 1; min-height: 0; background: #131313; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stage svg, .stage img { width: 100%; height: 100%; display: block; }
.lane { cursor: pointer; }
.glow-f { opacity: 0; transform-box: fill-box; transform-origin: center; }
.glow-h { opacity: 0; }
.ripple { opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
.glow-f { mix-blend-mode: screen; }
#count { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); font-size: clamp(80px, 22vh, 180px); font-weight: 900; color: var(--amber); pointer-events: none; opacity: 0; }
#count.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { opacity: 1; transform: translateX(-50%) scale(1.5); } 100% { opacity: 0; transform: translateX(-50%) scale(.9); } }
#done { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(15,15,15,.88); border-radius: 12px; font-size: clamp(36px, 8vw, 72px); font-weight: 800; color: #fff; }
#done.show { display: flex; }
#tl { display: block; width: 100%; height: 132px; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.controls { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; padding-top: 10px; }
.play { width: 96px; height: 96px; border-radius: 50%; font-size: 42px; background: var(--amber); color: #000; }
.play.stop { background: var(--stop); color: #fff; }
.play:active { filter: brightness(.9); }
.seg { display: inline-flex; gap: 2px; background: var(--card); border: 1px solid #1e1e1e; border-radius: 8px; padding: 3px; }
.seg button { min-height: 44px; padding: 0 14px; border-radius: 6px; color: var(--dim); font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--line2); color: var(--amber); }
.lvl { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lvl-note { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); }
.pill { min-height: 44px; padding: 0 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--line2); color: #aaa; font-size: 13px; font-weight: 600; }
.pill[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
</style>
</head>

let ctx = null, master = null, noiseBuf = null;

function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0.85;
    master.connect(comp); comp.connect(ctx.destination);

    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  if (ctx.state === 'suspended') ctx.resume();
  return ctx;

function env(out, t, peak, dur, attack = 0.002) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(out);
  return g;
}
function tone(out, t, f0, dur, type, peak, f1) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(env(out, t, peak, dur)); o.start(t); o.stop(t + dur + 0.02);
}
function noise(out, t, dur, filt, freq, q, peak) {

  s.connect(f); f.connect(env(out, t, peak, dur));
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}

  const v = vel / 127;

  else if (note === 38 || note === 40) V.snare(out, t, v);
  else if (note === 37) V.rim(out, t, v);
  else if (TOM[note]) V.tom(out, t, v, TOM[note]);
  else if (note === 42 || note === 44) V.hat(out, t, v, false);

      <div class="emoji">${s.emoji}</div>
      <div class="name">${s.title}</div>
      <div class="meta">${prog.plays[s.slug] ? '🎉 ' + prog.plays[s.slug] : ''}</div>
    </a>`).join('');
  app.innerHTML = `<div class="lib-head"><div class="brand">Mini Drummer</div><div class="lib-h1">Drums</div>
    <div class="lib-sub">Pick a song, then play along on the drum, its rim and the cup.</div></div>` +
    (SONGS.length ? `<div class="grid">${cards}</div>` : `<div class="empty">No songs yet. Add a .mid to midi/ and run node build.js</div>`);
  app.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const k = b.dataset.star;
    prog.starred[k] = !prog.starred[k]; if (!prog.starred[k]) delete prog.starred[k];
    saveProg(); b.textContent = prog.starred[k] ? '⭐' : '☆';
  }));
}

// play state
const LEVEL_NOTE = ['Half notes', 'Quarter notes', 'Eighth notes', '16th notes', 'Every hit'];
let song = null, run = null, speed = 1, laneHits = [[], [], []], nextI = [0, 0, 0];
const LEAD = 0.5, FLASH = 0.22;

function buildLaneHits() {
  laneHits = [[], [], []];
  for (const [ms, lane, lvl] of song.hits) if (lvl <= prog.level) laneHits[lane].push(ms / 1000);
  nextI = [0, 0, 0];
  drawTimeline(run ? songHeard() : 0);
}

function songView(s) {
  song = s;
  app.innerHTML = `
    <div class="top">
      <button class="home" aria-label="home">🏠</button>
      <div style="flex:1"><div class="song-label">Now playing</div><div class="song-title">${s.emoji} ${s.title}</div></div>
      <div class="song-meta"><strong>${s.bpm}</strong> bpm<br>${Math.floor(s.dur / 60)}:${String(Math.round(s.dur % 60)).padStart(2, '0')}</div>
    </div>
    <div class="stage">${sceneSvg()}<div id="count"></div>
      <div id="done"><div>🎉 Yay! 🎉</div><button class="play" id="again" aria-label="again">▶</button></div></div>
    <canvas id="tl" aria-label="timeline"></canvas>
    <div class="controls">
      <div class="lvl">
        <div class="seg" id="lvls" role="group" aria-label="Level">
          ${[1, 2, 3, 4, 5].map(l => `<button data-l="${l}" aria-pressed="${prog.level === l}">Level ${l}</button>`).join('')}
        </div>
        <div class="lvl-note" id="lvlnote">${LEVEL_NOTE[prog.level - 1]}</div>
      </div>
      <button class="play" id="go" aria-label="play">▶</button>
      <button class="pill" id="slow" aria-pressed="${speed < 1}">🐢 Slow</button>
    </div>`;
  buildLaneHits();
  app.querySelector('.home').onclick = () => { location.hash = '#/'; };
  app.querySelectorAll('.lane').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); tap(+el.dataset.lane); flashTap(+el.dataset.lane); }));
  app.querySelector('#go').onclick = () => (run ? stopSong() : startSong());
  app.querySelector('#again').onclick = startSong;
  app.querySelector('#lvls').onclick = e => {
    const l = +(e.target.dataset && e.target.dataset.l); if (!l) return;
    prog.level = l; saveProg();
    app.querySelectorAll('#lvls button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === l));
    document.getElementById('lvlnote').textContent = LEVEL_NOTE[l - 1];
    buildLaneHits();
  };
  app.querySelector('#slow').onclick = e => {
    speed = speed < 1 ? 1 : 0.6; e.currentTarget.setAttribute('aria-pressed', speed < 1); stopSong();
  };
}

// ---------- playback ----------
function startSong() {
  audio();
  stopSong();
  const beat = 60 / song.bpm;
  const lead = song.countIn * beat;
  const bus = ctx.createGain(); bus.connect(master);
  run = {
    bus, beat, t0: ctx.currentTime + 0.2 + lead / speed, // audio time of song time 0
    p: { bass: 0, lead: 0, drums: 0 }, ticks: 0, lastCount: 0, ended: false,
  };
  buildLaneHits();
  document.getElementById('done').classList.remove('show');
  const go = document.getElementById('go'); go.textContent = '⏹'; go.classList.add('stop');
  run.timer = setInterval(schedule, 30);
  run.raf = requestAnimationFrame(frame);
}

function stopSong() {
  if (!run) return;
  clearInterval(run.timer); cancelAnimationFrame(run.raf);
  run.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
  const bus = run.bus; setTimeout(() => bus.disconnect(), 300);
  run = null;
  const go = document.getElementById('go');
  if (go) { go.textContent = '▶'; go.classList.remove('stop'); }
  for (let l = 0; l < 3; l++) setGlow(l, 0);
  drawTimeline(0);
  const c = document.getElementById('count'); if (c) c.style.opacity = 0;
}

const songNow = () => (ctx.currentTime - run.t0) * speed;                          // what has been scheduled to play
// What the speaker is playing right now: the audio clock runs ahead of the sound by the output latency.
const songHeard = () => (ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0) - run.t0) * speed;

function schedule() {
  if (!run) return;
  const horizon = songNow() + 0.3 * speed;
  const at = s => run.t0 + s / speed;
  // count-in clicks
  while (run.ticks < song.countIn && -(song.countIn - run.ticks) * run.beat < horizon) {
    const s = -(song.countIn - run.ticks) * run.beat;
    tone(run.bus, Math.max(at(s), ctx.currentTime), run.ticks === 0 ? 1500 : 1000, 0.06, 'square', 0.25);
    run.ticks++;
  }
  for (const key of ['bass', 'lead']) {
    const a = song[key];
    while (run.p[key] < a.length && a[run.p[key]][0] / 1000 < horizon) {
      const [t, d, n, v] = a[run.p[key]++];
      pitched(run.bus, Math.max(at(t / 1000), ctx.currentTime), d / 1000 / speed, n, v, key === 'bass');
    }
  }
  const dr = song.drums;
  while (run.p.drums < dr.length && dr[run.p.drums][0] / 1000 < horizon) {
    const [t, n, v] = dr[run.p.drums++];
    gm(run.bus, n, Math.max(at(t / 1000), ctx.currentTime), v);
  }
}

function setGlow(l, v, rp = 1) {
  const f = document.getElementById('f' + l), h = document.getElementById('h' + l), r = document.getElementById('r' + l);
  if (!f) return;
  f.style.opacity = v * 0.5; h.style.opacity = v * 0.9;
  f.style.transform = `scale(${1 + 0.025 * v})`;
  r.style.opacity = rp < 1 ? 0.9 * (1 - rp) : 0;               // expanding ring right after a hit
  r.style.transform = `scale(${1 + 0.1 * rp})`;
}
const tapFlash = [0, 0, 0];
function flashTap(l) { tapFlash[l] = performance.now(); if (!run) requestAnimationFrame(tapFrame); }
function tapFrame() {
  let live = false;
  for (let l = 0; l < 3; l++) {
    const v = Math.max(0, 1 - (performance.now() - tapFlash[l]) / 250);
    if (!run) setGlow(l, v);
    if (v > 0) live = true;
  }
  if (live && !run) requestAnimationFrame(tapFrame);
}

function frame() {
  if (!run) return;
  const now = songHeard();
  for (let l = 0; l < 3; l++) {
    const a = laneHits[l];
    while (nextI[l] < a.length && a[nextI[l]] <= now) nextI[l]++;
    const last = nextI[l] > 0 ? a[nextI[l] - 1] : -1e9;
    const next = nextI[l] < a.length ? a[nextI[l]] : 1e9;
    const flash = Math.max(0, 1 - (now - last) / speed / FLASH);
    const charge = Math.max(0, 1 - (next - now) / speed / LEAD);
    const tp = Math.max(0, 1 - (performance.now() - tapFlash[l]) / 250);
    setGlow(l, Math.max(flash, 0.7 * charge * charge, tp), Math.min(1, (now - last) / speed / 0.45));
  }
  drawTimeline(now);
  // count-in number
  if (now < 0) {
    const n = Math.floor((now + song.countIn * run.beat) / run.beat) + 1;
    if (n !== run.lastCount && n >= 1 && n <= song.countIn) {
      run.lastCount = n;
      const c = document.getElementById('count');
      c.textContent = n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }
  }
  if (now > song.dur + 0.8) {
    prog.plays[song.slug] = (prog.plays[song.slug] || 0) + 1; saveProg();
    stopSong();
    document.getElementById('done').classList.add('show');
    return;
  }
  run.raf = requestAnimationFrame(frame);
}

// ---------- timeline: three rows, a playhead sweeping left to right, one page of 8 beats at a time ----------
const TL_COLORS = ['#f5a623', '#5b9bd5', '#ff6b81'], TL_NAMES = ['Drum', 'Rim', 'Cup'], PAGE_BEATS = 8, TL_ORDER = [1, 0, 2];   // top to bottom: rim, drum, cup
function lowerBound(a, x) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < x) lo = m + 1; else hi = m; } return lo; }

function drawTimeline(now) {
  const cv = document.getElementById('tl');
  if (!cv || !song) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  const beat = 60 / song.bpm, pageSec = PAGE_BEATS * beat;
  const page = Math.max(0, Math.floor(now / pageSec)), p0 = page * pageSec;
  const padY = 10, labelW = 66, x0 = labelW, x1 = W - 14, rowH = (H - padY * 2) / 3;
  const X = t => x0 + (t - p0) / pageSec * (x1 - x0);

  // rows
  for (let row = 0; row < 3; row++) {
    const l = TL_ORDER[row], y = padY + row * rowH;
    c.fillStyle = 'rgba(255,255,255,0.035)';
    c.beginPath(); c.roundRect(x0, y + 3, x1 - x0, rowH - 6, 8); c.fill();
    c.fillStyle = TL_COLORS[l]; c.globalAlpha = 0.9;
    c.beginPath(); c.arc(14, y + rowH / 2, 5, 0, 7); c.fill(); c.globalAlpha = 1;
    c.fillStyle = '#888'; c.font = '600 10px "Helvetica Neue", Helvetica, Arial, sans-serif'; c.textBaseline = 'middle';
    c.fillText(TL_NAMES[l].toUpperCase(), 26, y + rowH / 2 + 0.5);
  }
  // beat and bar lines
  for (let b = 0; b <= PAGE_BEATS; b++) {
    const x = X(p0 + b * beat);
    c.strokeStyle = b % 4 === 0 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)';
    c.lineWidth = 1; c.beginPath(); c.moveTo(x, padY); c.lineTo(x, H - padY); c.stroke();
  }
  // hits
  const r = Math.min(rowH * 0.32, 15);
  for (let row = 0; row < 3; row++) {
    const l = TL_ORDER[row], a = laneHits[l], cy = padY + row * rowH + rowH / 2;
    for (let i = lowerBound(a, p0 - 0.01); i < a.length && a[i] < p0 + pageSec; i++) {
      const t = a[i], x = X(t), d = (now - t) / speed;
      c.fillStyle = TL_COLORS[l];
      if (d > 0.3) { c.globalAlpha = 0.3; c.beginPath(); c.arc(x, cy, r * 0.8, 0, 7); c.fill(); }          // already played
      else if (d >= 0) { c.globalAlpha = 1; c.beginPath(); c.arc(x, cy, r * (1 + 0.7 * (1 - d / 0.3)), 0, 7); c.fill(); }  // hit now
      else { c.globalAlpha = 1; c.beginPath(); c.arc(x, cy, r, 0, 7); c.fill(); }                         // coming up
    }
  }
  c.globalAlpha = 1;
  // playhead
  const px = X(Math.max(now, p0));
  c.save(); c.shadowColor = '#f5a623'; c.shadowBlur = 10; c.strokeStyle = '#f5a623'; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(px, padY - 4); c.lineTo(px, H - padY + 4); c.stroke(); c.restore();
}
addEventListener('resize', () => drawTimeline(run ? songHeard() : 0));

// ---------- routing ----------
function route() {
  stopSong();
  const m = location.hash.match(/^#\/song\/(.+)$/);
  const s = m && SONGS.find(x => x.slug === m[1]);
  if (s) songView(s); else libraryView();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
