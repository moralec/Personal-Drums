<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Drummer</title>
<style>
:root {
  --bg1: #dff1ff; --bg2: #fff4dc; --ink: #2b2a4c; --card: #ffffff;
  --head: #8b5cf6; --rim: #2f80ed; --cup: #ffb703; --go: #2dc653; --stop: #ef476f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: ui-rounded, "Nunito", "Avenir Next Rounded", system-ui, sans-serif;
  color: var(--ink); background: linear-gradient(180deg, var(--bg1), var(--bg2));
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
#app { height: 100%; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }

/* library */
.lib-title { font-size: clamp(28px, 6vw, 48px); font-weight: 800; margin: 8px 0 16px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; overflow: auto; padding: 4px 2px 24px; }
.card { position: relative; background: var(--card); border-radius: 28px; padding: 20px 12px 16px; text-align: center; box-shadow: 0 6px 0 rgba(43,42,76,.12); display: block; text-decoration: none; color: inherit; }
.card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(43,42,76,.12); }
.card .emoji { font-size: 64px; line-height: 1.1; }
.card .name { font-size: 22px; font-weight: 800; margin-top: 6px; }
.card .meta { font-size: 14px; opacity: .6; margin-top: 4px; }
.card .star { position: absolute; top: 8px; right: 8px; width: 48px; height: 48px; border-radius: 50%; background: transparent; font-size: 28px; }
.empty { text-align: center; opacity: .7; margin-top: 40px; font-size: 18px; }

/* song */
.top { display: flex; align-items: center; gap: 12px; }
.home { width: 64px; height: 64px; border-radius: 50%; background: var(--card); font-size: 30px; box-shadow: 0 4px 0 rgba(43,42,76,.12); flex: none; }
.song-title { font-size: clamp(22px, 4.5vw, 36px); font-weight: 800; flex: 1; }
.bpm { font-size: 14px; opacity: .6; }
.stage { position: relative; flex: 1; min-height: 0; }
.stage svg { width: 100%; height: 100%; display: block; }
.lane { cursor: pointer; }
.glow-f { opacity: 0; transform-box: fill-box; transform-origin: center; }
.glow-h { opacity: 0; }
#count { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); font-size: clamp(80px, 22vh, 180px); font-weight: 900; color: var(--stop); text-shadow: 0 6px 0 rgba(43,42,76,.15); pointer-events: none; opacity: 0; }
#count.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { opacity: 1; transform: translateX(-50%) scale(1.5); } 100% { opacity: 0; transform: translateX(-50%) scale(.9); } }
#done { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: rgba(255,255,255,.82); border-radius: 32px; font-size: clamp(40px, 9vw, 80px); font-weight: 900; }
#done.show { display: flex; }
.controls { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding-top: 8px; }
.play { width: 112px; height: 112px; border-radius: 50%; font-size: 52px; background: var(--go); color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
.play.stop { background: var(--stop); }
.play:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pill { min-height: 48px; padding: 6px 16px; border-radius: 24px; background: var(--card); font-size: 16px; font-weight: 700; box-shadow: 0 3px 0 rgba(43,42,76,.12); }
.pill[aria-pressed="true"] { background: var(--ink); color: #fff; }
</style>
</head>

let ctx = null, master = null, noiseBuf = null;

function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0.85;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function env(out, t, peak, dur, attack = 0.002) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(out);
  return g;
}
function tone(out, t, f0, dur, type, peak, f1) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(env(out, t, peak, dur)); o.start(t); o.stop(t + dur + 0.02);
}
function noise(out, t, dur, filt, freq, q, peak) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = filt; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(env(out, t, peak, dur));
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
const V = {
  kick:  (o, t, v) => tone(o, t, 140, 0.28, 'sine', v, 42),
  snare: (o, t, v) => { noise(o, t, 0.18, 'bandpass', 1800, 0.8, v * 0.8); tone(o, t, 200, 0.1, 'triangle', v * 0.5, 120); },
  tom:   (o, t, v, f) => tone(o, t, f, 0.35, 'sine', v, f * 0.6),
  hat:   (o, t, v, open) => noise(o, t, open ? 0.32 : 0.05, 'highpass', 7000, 0.7, v * 0.4),
  crash: (o, t, v) => noise(o, t, 1.2, 'highpass', 5000, 0.5, v * 0.5),
  ride:  (o, t, v) => { noise(o, t, 0.35, 'bandpass', 6500, 1.2, v * 0.3); tone(o, t, 3100, 0.3, 'sine', v * 0.12); },
  rim:   (o, t, v) => { tone(o, t, 950, 0.06, 'square', v * 0.28, 700); noise(o, t, 0.03, 'highpass', 3000, 0.7, v * 0.5); },
  cup:   (o, t, v) => [1, 2.76, 5.4, 8.93].forEach((m, i) => tone(o, t, 780 * m, 1.0 / (i + 1) + 0.2, 'sine', v * 0.35 / (i + 1))),
};
const TOM = { 41: 90, 43: 110, 45: 130, 47: 150, 48: 170, 50: 190 };
function gm(out, note, t, vel) {
  const v = vel / 127;
  if (note === 35 || note === 36) V.kick(out, t, v);
  else if (note === 38 || note === 40) V.snare(out, t, v);
  else if (note === 37) V.rim(out, t, v);
  else if (TOM[note]) V.tom(out, t, v, TOM[note]);
  else if (note === 42 || note === 44) V.hat(out, t, v, false);
  else if (note === 46) V.hat(out, t, v, true);
  else if (note === 49 || note === 52 || note === 55 || note === 57) V.crash(out, t, v);
  else if (note === 51 || note === 53 || note === 59) V.ride(out, t, v);
}
function pitched(out, t, dur, midi, vel, bass) {
  const o = ctx.createOscillator(); o.type = 'triangle';
  o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ctx.createGain(), peak = (bass ? 0.3 : 0.16) * vel / 127, end = t + Math.max(dur, 0.05);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  g.gain.setValueAtTime(peak, end);
  g.gain.exponentialRampToValueAtTime(0.0001, end + 0.1);
  if (bass) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; o.connect(f); f.connect(g); }
  else o.connect(g);
  g.connect(out); o.start(t); o.stop(end + 0.12);
}
function tap(lane) {
  audio();
  const t = ctx.currentTime;
  [V.snare, V.rim, V.cup][lane](master, t, 0.9);
}

// ---------- views ----------
const app = document.getElementById('app');

function libraryView() {
  const cards = SONGS.map(s => `
    <a class="card" href="#/song/${s.slug}">
      <button class="star" data-star="${s.slug}" aria-label="favourite">${prog.starred[s.slug] ? '⭐' : '☆'}</button>
      <div class="emoji">${s.emoji}</div>
      <div class="name">${s.title}</div>
      <div class="meta">${prog.plays[s.slug] ? '🎉 ' + prog.plays[s.slug] : ''}</div>
    </a>`).join('');
  app.innerHTML = `<div class="lib-title">🥁 Mini Drummer</div>` +
    (SONGS.length ? `<div class="grid">${cards}</div>` : `<div class="empty">No songs yet. Add a .mid to midi/ and run node build.js</div>`);
  app.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const k = b.dataset.star;
    prog.starred[k] = !prog.starred[k]; if (!prog.starred[k]) delete prog.starred[k];
    saveProg(); b.textContent = prog.starred[k] ? '⭐' : '☆';
  }));
}

      <button class="play" id="go" aria-label="play">▶</button>
      <div class="opts">
        <button class="pill" id="slow" aria-pressed="${speed < 1}">🐢 Slow</button>
        <button class="pill" id="hear" aria-pressed="${hearDrums}">🥁 Hear drums</button>
      </div>
    </div>`;
  buildLaneHits();
  app.querySelector('.home').onclick = () => { location.hash = '#/'; };
  app.querySelectorAll('.lane').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); tap(+el.dataset.lane); flashTap(+el.dataset.lane); }));
  app.querySelector('#go').onclick = () => (run ? stopSong() : startSong());
  app.querySelector('#again').onclick = startSong;
  app.querySelector('#lvls').onclick = e => {
    const l = +(e.target.dataset && e.target.dataset.l); if (!l) return;
    prog.level = l; saveProg();
    app.querySelectorAll('#lvls .pill').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === l));
    buildLaneHits();
  };
  app.querySelector('#slow').onclick = e => {
    speed = speed < 1 ? 1 : 0.6; e.currentTarget.setAttribute('aria-pressed', speed < 1); stopSong();
  };
  app.querySelector('#hear').onclick = e => {
    hearDrums = !hearDrums; e.currentTarget.setAttribute('aria-pressed', hearDrums);
  };
}

// ---------- playback ----------
function startSong() {
  audio();
  stopSong();
  const beat = 60 / song.bpm;
  const lead = song.countIn * beat;
  const bus = ctx.createGain(); bus.connect(master);
  run = {
    bus, beat, t0: ctx.currentTime + 0.2 + lead / speed, // audio time of song time 0
    p: { bass: 0, lead: 0, drums: 0 }, ticks: 0, lastCount: 0, ended: false,
  };
  buildLaneHits();
  document.getElementById('done').classList.remove('show');
  const go = document.getElementById('go'); go.textContent = '⏹'; go.classList.add('stop');
  run.timer = setInterval(schedule, 30);
  run.raf = requestAnimationFrame(frame);
}

function stopSong() {
  if (!run) return;
  clearInterval(run.timer); cancelAnimationFrame(run.raf);
  run.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
  const bus = run.bus; setTimeout(() => bus.disconnect(), 300);
  run = null;
  const go = document.getElementById('go');
  if (go) { go.textContent = '▶'; go.classList.remove('stop'); }
  for (let l = 0; l < 3; l++) setGlow(l, 0);
  const c = document.getElementById('count'); if (c) c.style.opacity = 0;
}

const songNow = () => (ctx.currentTime - run.t0) * speed;

function schedule() {
  if (!run) return;
  const horizon = songNow() + 0.3 * speed;
  const at = s => run.t0 + s / speed;
  // count-in clicks
  while (run.ticks < song.countIn && -(song.countIn - run.ticks) * run.beat < horizon) {
    const s = -(song.countIn - run.ticks) * run.beat;
    tone(run.bus, Math.max(at(s), ctx.currentTime), run.ticks === 0 ? 1500 : 1000, 0.06, 'square', 0.25);
    run.ticks++;
  }
  for (const key of ['bass', 'lead']) {
    const a = song[key];
    while (run.p[key] < a.length && a[run.p[key]][0] / 1000 < horizon) {
      const [t, d, n, v] = a[run.p[key]++];
      pitched(run.bus, Math.max(at(t / 1000), ctx.currentTime), d / 1000 / speed, n, v, key === 'bass');
    }
  }
  const dr = song.drums;
  while (run.p.drums < dr.length && dr[run.p.drums][0] / 1000 < horizon) {
    const [t, n, v] = dr[run.p.drums++];
    if (hearDrums || n === 35 || n === 36) gm(run.bus, n, Math.max(at(t / 1000), ctx.currentTime), v);
  }
}

function setGlow(l, v) {
  const f = document.getElementById('f' + l), h = document.getElementById('h' + l);
  if (!f) return;
  f.style.opacity = v; h.style.opacity = v;
  f.style.transform = `scale(${1 + 0.05 * v})`;
}
const tapFlash = [0, 0, 0];
function flashTap(l) { tapFlash[l] = performance.now(); if (!run) requestAnimationFrame(tapFrame); }
function tapFrame() {
  let live = false;
  for (let l = 0; l < 3; l++) {
    const v = Math.max(0, 1 - (performance.now() - tapFlash[l]) / 250);
    if (!run) setGlow(l, v);
    if (v > 0) live = true;
  }
  if (live && !run) requestAnimationFrame(tapFrame);
}

function frame() {
  if (!run) return;
  const now = songNow();
  for (let l = 0; l < 3; l++) {
    const a = laneHits[l];
    while (nextI[l] < a.length && a[nextI[l]] <= now) nextI[l]++;
    const last = nextI[l] > 0 ? a[nextI[l] - 1] : -1e9;
    const next = nextI[l] < a.length ? a[nextI[l]] : 1e9;
    const flash = Math.max(0, 1 - (now - last) / speed / FLASH);
    const charge = Math.max(0, 1 - (next - now) / speed / LEAD);
    const tp = Math.max(0, 1 - (performance.now() - tapFlash[l]) / 250);
    setGlow(l, Math.max(flash, 0.7 * charge * charge, tp));
  }
  // count-in number
  if (now < 0) {
    const n = Math.floor((now + song.countIn * run.beat) / run.beat) + 1;
    if (n !== run.lastCount && n >= 1 && n <= song.countIn) {
      run.lastCount = n;
      const c = document.getElementById('count');
      c.textContent = n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }
  }
  if (now > song.dur + 0.8) {
    prog.plays[song.slug] = (prog.plays[song.slug] || 0) + 1; saveProg();
    stopSong();
    document.getElementById('done').classList.add('show');
    return;
  }
  run.raf = requestAnimationFrame(frame);
}

// ---------- routing ----------
function route() {
  stopSong();
  const m = location.hash.match(/^#\/song\/(.+)$/);
  const s = m && SONGS.find(x => x.slug === m[1]);
  if (s) songView(s); else libraryView();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
